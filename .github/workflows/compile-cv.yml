name: Compile LaTeX CVs

on:
  push:
    paths:
      - '**.tex'
      - '.github/workflows/compile-cv.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile Keyloop CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: keyloop_cv.tex

      - name: Compile Sigmoid CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: sigmoid_cv.tex

      - name: Compile Maneuver CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: maneuver_cv.tex

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vishal_Patil_CV_Variants
          path: |
            keyloop_cv.pdf
            sigmoid_cv.pdf
            maneuver_cv.pdf

      - name: Commit PDFs to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keyloop_cv.pdf sigmoid_cv.pdf maneuver_cv.pdf
          git diff --cached --quiet || git commit -m "Auto-compile CV PDFs"
          git push